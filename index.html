:root{--bg:#0b0b0d;--card:#17171b;--raised:#222228;--line:#2a2a31;--txt:#f2f2f5;--dim:#8d8d99;--ac:var(--txt);--onac:var(--bg);--ease:cubic-bezier(.22,1,.36,1);--r1:12px;--r2:16px;--r3:14px;--cw:128px;--font:Montserrat;box-sizing:border-box;color-scheme:dark}
html[data-theme=gray]{--bg:#2b2c32;--card:#363840;--raised:#444752;--line:#4a4d58;--txt:#eef0f6;--dim:#a0a4b0}
html[data-theme=light]{--bg:#f3f4f8;--card:#fff;--raised:#e8eaf1;--line:#d4d7e0;--txt:#12131a;--dim:#6c7080;color-scheme:light}
html[data-theme=oled]{--bg:#000;--card:#0e0f13;--raised:#1a1c22;--line:#24262d}
html[data-accent=blue]{--ac:#5b6cff;--onac:#fff}html[data-accent=pink]{--ac:#ff5c8a;--onac:#fff}html[data-accent=green]{--ac:#2fbf7f;--onac:#fff}html[data-accent=orange]{--ac:#ff8a2b;--onac:#fff}html[data-accent=purple]{--ac:#a46bff;--onac:#fff}
html[data-font=Nunito]{--font:Nunito}html[data-font=Outfit]{--font:Outfit}html[data-font=SpaceGrotesk]{--font:"Space Grotesk"}
html[data-corner=sharp]{--r1:6px;--r2:8px;--r3:6px}html[data-corner=round]{--r1:18px;--r2:23px;--r3:20px}
html[data-card=s]{--cw:108px}html[data-card=l]{--cw:152px}
html.nobadge .badge{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font),"Segoe UI",system-ui,sans-serif;height:100%;overflow:hidden}
#sc{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
input{font:inherit;color:inherit}
.top,.bot{position:fixed;left:0;right:0;z-index:10;pointer-events:none;transition:transform .45s var(--ease),opacity .35s}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 14px;background:linear-gradient(var(--bg) 55%,transparent);display:flex;gap:10px;align-items:center}
.bot{bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 40px);background:linear-gradient(transparent,var(--bg) 70%)}
.hide.top{transform:translateY(-100%);opacity:0}.hide.bot{transform:translateY(100%);opacity:0}
.title{flex:1;min-width:0;pointer-events:auto;height:46px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r2);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.btn{position:relative;pointer-events:auto;flex:none;width:46px;height:46px;border-radius:var(--r2);border:1.5px solid var(--line);background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:transform .28s var(--ease),background-color .3s,color .3s,border-color .3s}
.btn:active{transform:scale(.92)}.btn.act{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding:calc(env(safe-area-inset-top,0px) + 78px) 0 110px}
.page.show{animation:vin .5s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#note{margin:0 16px 16px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:var(--r1);color:var(--dim);font-size:12px;line-height:1.5;text-align:center;display:none}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:12px;padding:0 16px}
.grid .card{flex:none;min-width:0}.grid .name{font-size:11px}.grid .meta{font-size:10px}
.grid[data-c="2"] .name{font-size:13px}.grid[data-c="2"] .meta{font-size:11.5px}.grid[data-c="4"] .name{font-size:10px}.grid[data-c="4"] .meta{font-size:9px}
.empty{color:var(--dim);font-size:13px;line-height:1.6;text-align:center;padding:40px 10px;grid-column:1/-1;animation:rise .6s var(--ease) both}
h2{display:block;width:fit-content;margin:0 16px 12px;padding:7px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r1);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px;margin-bottom:16px;scroll-snap-type:x proximity;scroll-padding:0 16px}
.card{flex:0 0 var(--cw);scroll-snap-align:start;cursor:pointer;animation:rise .6s var(--ease) both;transition:transform .3s var(--ease)}
.card:active{transform:scale(.96)}
.poster{position:relative;aspect-ratio:3/4;border-radius:var(--r3);overflow:hidden;border:1.5px solid var(--line)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;bottom:8px;padding:4px 7px;border-radius:calc(var(--r1) - 3px);border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700}
.box{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r1)}
.nbox{margin-top:8px;padding:7px 9px;min-height:49px;display:flex;align-items:center;justify-content:center;text-align:center}
.name{font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:6px;padding:6px 9px;text-align:center;font-size:11px;font-weight:500;color:var(--dim)}
#navw{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:314px;height:58px;z-index:12;transform:translateX(-50%);transition:transform .45s var(--ease),opacity .35s}
#navw.hide{transform:translate(-50%,160%);opacity:0}
#nav{position:absolute;inset:0;border-radius:calc(var(--r2)*1.8);border:1.5px solid var(--line);background:var(--card)}

function seasonNow(){var d=new Date(),m=d.getMonth(),S={0:'WINTER',3:'SPRING',6:'SUMMER',9:'FALL'}[m];return S?{season:S,year:d.getFullYear(),label:cap(S)+' '+d.getFullYear()}:null}
function activeEvent(){var d=new Date(),t=(d.getMonth()+1)*100+d.getDate();for(var i=0;i<EVENTS.length;i++){var e=EVENTS[i],a=+e.start.replace('-',''),b=+e.end.replace('-','');if(a<=b?(t>=a&&t<=b):(t>=a||t<=b))return e}return null}
function loadExtra(){var se=seasonNow(),ev=activeEvent();
if(se)gql(F+'query($se:MediaSeason,$y:Int){Page(perPage:18){media(type:ANIME,isAdult:false,season:$se,seasonYear:$y,sort:POPULARITY_DESC){...F}}}',{se:se.season,y:se.year}).then(function(d){HD.s=d.Page.media;renderRows()}).catch(function(){});
if(ev&&ev.ids&&ev.ids.length)gql(F+'query($i:[Int]){Page(perPage:50){media(id_in:$i,isAdult:false){...F}}}',{i:ev.ids}).then(function(d){HD.f=d.Page.media;renderRows()}).catch(function(){})}
function evOn(){try{return localStorage.getItem('evoff')!='1'}catch(e){return true}}

var lurl='';
function askLeave(u){lurl=u;var h=u;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){}$('ldest').textContent='Destination: '+h;$('lsh').classList.add('open')}

/* ===== APK update checker (set GH_REPO to 'owner/repo' once a release repo exists) ===== */
var GH_REPO='';
function isWV(){var u=navigator.userAgent||'';return /; wv\)/.test(u)||/\bwv\b/.test(u)||!!window.Android}
function vnum(v){return String(v||'').replace(/^[^\d]*/,'').split('.').map(function(x){return parseInt(x)||0})}
function newer(a,b){a=vnum(a);b=vnum(b);for(var i=0;i<3;i++){if((a[i]||0)>(b[i]||0))return true;if((a[i]||0)<(b[i]||0))return false}return false}
function showUpd(tag,url){var dis='';try{dis=localStorage.getItem('updd')||''}catch(e){}if(dis==tag||$('updb'))return;var b=el('div','updb');b.id='updb';var t=el('span',null,'Update available: '+tag),g=el('b',null,'Get'),x=el('i',null,'\u00d7');g.onclick=function(){askLeave(url)};x.onclick=function(){try{localStorage.setItem('updd',tag)}catch(e){}b.remove()};b.append(t,g,x);document.body.appendChild(b)}
function manualUpd(cb){fetch('https://api.github.com/repos/'+GH_REPO+'/releases/latest').then(function(r){return r.json()}).then(function(j){if(!j||!j.tag_name){cb('No releases yet');return}var as=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name)})[0],url=as?as.browser_download_url:j.html_url;if(newer(j.tag_name,APP_VERSION)){cb('Update available: '+j.tag_name);showUpd(j.tag_name,url)}else cb('You are up to date')}).catch(function(){cb('Could not check right now')})}
function checkUpd(){if(!GH_REPO||!isWV())return;var c=null;try{c=JSON.parse(localStorage.getItem('updc')||'null')}catch(e){}if(c&&Date.now()-c.t<864e5){if(newer(c.tag,APP_VERSION))showUpd(c.tag,c.url);return}
fetch('https://api.github.com/repos/'+GH_REPO+'/releases/latest').then(function(r){return r.json()}).then(function(j){if(!j||!j.tag_name)return;var asset=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name)})[0],url=asset?asset.browser_download_url:j.html_url;try{localStorage.setItem('updc',JSON.stringify({t:Date.now(),tag:j.tag_name,url:url}))}catch(e){}if(newer(j.tag_name,APP_VERSION))showUpd(j.tag_name,url)}).catch(function(){})}
setTimeout(checkUpd,4000);
